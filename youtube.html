<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUTUBE BUILD 1</title>
    <link rel="stylesheet" href="./youtube.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    

<div class="main-container">
    <div class="background-image-container">
        <div class="time-laps">
            <p>1:48:16</p>
        </div>
    </div>
    <div class="image-title-icon-container">
        <div class="image-container">
            <img src="./img/youtube.png" alt="this is a portait photo of a young lady">
        </div>
        <div class="title-container">
            <div class="title-names">
                <div class="title">
                    <h1>FAME AND FURY. STARING DANIEL ETIM</h1>
                </div>
                <div class="names">
                    <h1>EFFIONG, BIMBO ADEMOYE, UZOR ARUKWE...</h1>
                </div>
            </div>
            <div class="tv-views">
                <div class="tv">
                    <p>Bimbo Ademoye TV</p>
                </div>
                <div class="views-icon-days">
                    <div class="views">
                        <p>3.4M views</p>
                    </div>
                    <div class="icon">
                        <i class="fa-solid fa-circle"></i>
                    </div>
                    <div class="days">
                        <p>5 days ago</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="icon-container">
           <i class="fa-solid fa-ellipsis-vertical"></i> 
        </div>

    </div>
</div>





</body>
</html>
