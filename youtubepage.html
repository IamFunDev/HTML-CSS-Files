<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube homePage</title>
    <link rel="stylesheet" href="./youtubepage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    
    <!-- maain container -->
    <div class="youtube-container">

        <!--Header container-->
        <div class="top-container">

            <!--top left container-->
            <div class="menu-logo">
                <div class="menu">
                    <i class="fa-solid fa-bars"></i>
                </div>
                <div class="youtube-logo">
                    <a href="">
                        <img src="./Img/youtube logo.svg" alt="YouTube Logo">
                    </a>
                </div>
            </div>

            <!--top center container-->
            <div class="search-section">
                <form class="form">
                    <input type="text" placeholder="Search" name="search" id="search">
                    <div class="search-icon">
                       <i class="fa-solid fa-magnifying-glass" ></i>
                    </div>
                </form>
                <div class="mic-container">
                    <i class="fa-solid fa-microphone"></i>
                </div>
            </div>

            <!--top right container-->
            <div class="create-section">
                <div class="create-icon-container">
                    <i class="fa-solid fa-plus"></i>
                </div>
                <div class="bell-icon-container">
                    <i class="fa-solid fa-bell"></i>
                </div>
                <div class="profile-icon-">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
            </div>
        </div>

        <!-- body container -->
        <div class="bottom-container">

            <!-- sidebar section -->
            <div class="sidebar-section">

                <!-- first sidebar section -->
                <div class="first-section">
                    <div class="-icon-home">
                        <i class="fa-solid fa-house"></i>
                        <p>Home</p>
                    </div>
                    <div class="icon-shorts">
                        <i class="fa-solid fa-video"></i>
                        <p>Shorts</p>
                    </div>
                    <div class="icon-sub">
                        <i class="fa-solid fa-user"></i>
                        <p>Subscriptions</p>
                    </div>
                </div>

                <!-- second sidebar section -->
                <div class="second-section">
                    <div class="icon-you">
                        <p>You</p>
                        <i class="fa-solid fa-angle-right"></i>
                    </div>
                    <div class="icon-history">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <p>History</p>
                    </div>
                    <div class="icon-playlist">
                        <i class="fa-solid fa-bars-staggered"></i>
                        <p>Playlists</p>
                    </div>
                    <div class="icon-watchlater">
                        <i class="fa-regular fa-clock"></i>
                        <p>WatchLater</p>
                    </div>
                    <div class="icon-likedvideos">
                        <i class="fa-solid fa-thumbs-up"></i>
                        <p>Liked Videos</p>
                    </div>
                </div>

                <!-- third sidebar section -->
                 <div class="third-section">
                    <p>Explore</p>
                    <div class="icon-trending">
                        <i class="fa-solid fa-fire"></i>
                        <p>Trending</p>
                    </div>
                    <div class="icon-music">
                        <i class="fa-solid fa-music"></i>
                        <p>Music</p>
                    </div>
                    <div class="icon-gaming">
                        <i class="fa-solid fa-gamepad"></i>
                        <p>Gaming</p>
                    </div>
                    <div class="icon-news">
                        <i class="fa-solid fa-newspaper"></i>
                        <p>News</p>
                    </div>
                    <div class="icon-sports">
                        <i class="fa-solid fa-trophy"></i>
                        <p>Sports</p>
                    </div>
                </div>
            </div>
        </div>
    </div>





    
</body>
</html>
